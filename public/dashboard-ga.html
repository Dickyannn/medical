<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="csrf-token-placeholder">
  <title>MedClaim — GA Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- APP SHELL -->
<div id="page-app" class="active">
  <div class="topbar">
    <div class="topbar-brand">MedClaim</div>
    <div class="topbar-sep"></div>
    <span class="topbar-role" id="role-badge">GA</span>
    <nav class="topbar-nav" id="topbar-nav"></nav>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">GA</div>
        <span id="user-name" style="font-size:0.84rem;color:var(--text-2)">Ahmad Syafii</span>
      </div>
      <button class="logout-btn" onclick="doLogout()">Keluar</button>
    </div>
  </div>

  <div id="app-content"></div>
</div>

<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script>
  function initDashboard() {
    console.log('=== Initializing GA Dashboard ===');
    
    // Pastikan role GA sudah di-set
    localStorage.setItem('medclaim_role', 'ga');
    const role = 'ga';
    console.log('Role set to:', role);
    
    // Check if functions exist
    console.log('initializeApp exists:', typeof initializeApp === 'function');
    console.log('renderGAUpload exists:', typeof renderGAUpload === 'function');
    console.log('buildNav exists:', typeof buildNav === 'function');
    console.log('switchTab exists:', typeof switchTab === 'function');
    
    // Initialize dashboard
    if (typeof initializeApp === 'function') {
      console.log('Calling initializeApp...');
      initializeApp(role);
      console.log('initializeApp completed');
    } else {
      console.error('initializeApp function not found');
    }
  }
  
  console.log('Document ready state:', document.readyState);
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDashboard);
  } else {
    initDashboard();
  }
</script>
</body>
</html>
