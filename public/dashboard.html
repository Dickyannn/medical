<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedClaim — Redirecting...</title>
</head>
<body style="margin:0;padding:0;background:#f5f3ee;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:DM Sans,sans-serif">
  <div style="text-align:center">
    <h2>Loading...</h2>
    <p>Mengalihkan ke dashboard Anda...</p>
  </div>

  <script>
    function redirectToDashboard() {
      const role = localStorage.getItem('medclaim_role');
      
      if (!role) {
        window.location.href = '/login.html';
      } else {
        const dashboardMap = {
          'ga': '/dashboard-ga.html',
          'reviewer': '/dashboard-reviewer.html',
          'fa': '/dashboard-fa.html'
        };
        window.location.href = dashboardMap[role] || '/login.html';
      }
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', redirectToDashboard);
    } else {
      redirectToDashboard();
    }
  </script>
</body>
</html>
